<svg xmlns="http://www.w3.org/2000/svg" width="950" height="510" viewBox="0 0 950 510"><rect width="950" height="510" fill="#101827"/><g font-family="sans-serif" fill="#edf3ff"><text x="30" y="40" font-size="24">Docker Cloud — communications HTTP</text><g fill="#234154" stroke="#76dcce" stroke-width="2"><rect x="30" y="140" width="180" height="80" rx="10"/><rect x="350" y="140" width="190" height="80" rx="10"/><rect x="720" y="65" width="200" height="80" rx="10"/><rect x="720" y="235" width="200" height="80" rx="10"/></g><g font-size="18" text-anchor="middle"><text x="120" y="184">Navigateur</text><text x="445" y="174">web :8080</text><text x="445" y="199">Proxy Node.js</text><text x="820" y="99">front :8080</text><text x="820" y="125">HTML + JavaScript</text><text x="820" y="269">back :8080</text><text x="820" y="295">Notes Node.js</text></g><g stroke="#76dcce" stroke-width="3" fill="none"><path d="M210 180H350m-10 -7 10 7 -10 7"/><path d="M540 160L720 105m-12 -3 12 3 -8 9"/><path d="M540 200L720 275m-8 -10 8 10 -12 1"/></g><g font-size="15"><text x="225" y="158">localhost:8080</text><text x="570" y="111">réseau ui : /</text><text x="558" y="272">réseau api : /api/notes</text><text x="30" y="335">Seul web publie un port sur l’hôte. Front et back sont isolés sur des réseaux internes.</text></g></g><text x="40" y="390" fill="#edf3ff" font-family="sans-serif" font-size="17">Back → /data/notes.json → volume notes-data (persistance après redémarrage)</text><text x="40" y="435" fill="#edf3ff" font-family="sans-serif" font-size="17">CI : lint (sans réseau) → succès → tests → réseau edge → web → front / back</text><text x="40" y="470" fill="#edf3ff" font-family="sans-serif" font-size="17">Profil ci : deux images personnalisées, jobs ponctuels avec limites CPU / RAM.</text></svg>