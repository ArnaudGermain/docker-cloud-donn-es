<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mon Docker Cloud</title><style>body{font:18px system-ui;max-width:760px;margin:10vh auto;padding:24px;background:#101827;color:#edf3ff}button{padding:12px;background:#76dcce;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}</style><h1>Mon Docker Cloud</h1><p>Front → serveur web → API : trois images personnalisées.</p><button id="hello">Interroger l’API</button><pre id="result" role="status"></pre><script>document.querySelector('#hello').onclick=async()=>{const o=document.querySelector('#result');try{const r=await fetch('/api/hello');if(!r.ok)throw Error('HTTP '+r.status);o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent='API indisponible : '+e.message}}</script></html>
