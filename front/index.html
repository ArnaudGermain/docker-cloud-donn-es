<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet de chantier</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18282f;background:#f1f4f2;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:#173d38;color:white;padding:32px max(20px,calc((100% - 1100px)/2))}header small{color:#b9d6cc;letter-spacing:.12em}h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}header p{margin:0;color:#d5e5df}main{max-width:1140px;margin:auto;padding:28px 20px;display:grid;grid-template-columns:340px 1fr;gap:24px}section{min-width:0}.panel,article{background:white;border:1px solid #dbe4df;border-radius:14px;padding:22px}h2{font-size:20px;margin:0 0 16px}label{display:block;font-weight:600;margin:14px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid #a7bcb2;border-radius:7px;background:white;color:inherit}textarea{resize:vertical;min-height:120px}button{border:1px solid #b7c8bf;border-radius:7px;padding:10px 14px;cursor:pointer;background:white;color:#183d35;min-height:44px}button.primary{background:#195e4e;color:white;border-color:#195e4e}button.danger{color:#a02d2d}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #dc9e31;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar select{flex:1}.toolbar button{flex-shrink:0}article{margin-bottom:14px}article h3{margin:0;font-size:19px}.meta{color:#60746b;font-size:14px}.description{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:13px;background:#fff0cf;color:#765411;margin-bottom:10px}.badge.en-cours{background:#e3edfc;color:#254f85}.badge.termine{background:#dcefe4;color:#255f3e}#message{max-width:1100px;margin:16px auto 0;padding:0 20px;min-height:24px}#message.error{color:#a02d2d}.empty{padding:32px;border:1px dashed #a7bcb2;border-radius:14px;text-align:center;color:#60746b}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr;padding:18px 14px}header{padding:24px 20px}.panel,article{padding:18px}}
</style>
</head>
<body>
<header><small>SUIVI DES INTERVENTIONS</small><h1>Carnet de chantier</h1><p>Tâches, matériel manquant et observations, au même endroit.</p></header>
<p id="message" role="status" aria-live="polite"></p>
<main>
<section class="panel"><h2 id="form-title">Nouvelle note</h2>
<form id="form">
<label for="chantier">Chantier</label><input id="chantier" name="chantier" maxlength="100" placeholder="Ex. Résidence des Tilleuls" required>
<label for="zone">Zone</label><input id="zone" name="zone" maxlength="100" placeholder="Ex. Étage 1, salle de bain" required>
<label for="description">Description</label><textarea id="description" name="description" maxlength="2000" placeholder="Tâche à réaliser, problème constaté…" required></textarea>
<label for="status">Statut</label><select id="status" name="status"><option value="a-faire">À faire</option><option value="en-cours">En cours</option><option value="termine">Terminé</option></select>
<div class="actions"><button class="primary" id="save">Ajouter la note</button><button type="button" id="cancel" hidden>Annuler</button></div>
</form></section>
<section aria-labelledby="list-title"><h2 id="list-title">Notes du chantier</h2><div class="toolbar"><select id="filter" aria-label="Filtrer par statut"><option value="all">Tous les statuts</option><option value="a-faire">À faire</option><option value="en-cours">En cours</option><option value="termine">Terminé</option></select><button id="refresh">Actualiser</button></div><div id="notes">Chargement…</div></section>
</main>
<script>
const form=document.querySelector('#form'), list=document.querySelector('#notes'), message=document.querySelector('#message');
const labels={'a-faire':'À faire','en-cours':'En cours','termine':'Terminé'};
let notes=[],editing=null,busy=false;
function tell(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
async function api(url,options={}){const response=await fetch(url,options);if(response.status===204)return null;const data=await response.json();if(!response.ok)throw Error(data.error||'Erreur du serveur');return data}
function reset(){editing=null;form.reset();document.querySelector('#form-title').textContent='Nouvelle note';document.querySelector('#save').textContent='Ajouter la note';document.querySelector('#cancel').hidden=true}
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
function render(){list.replaceChildren();const filtered=notes.filter(n=>document.querySelector('#filter').value==='all'||n.status===document.querySelector('#filter').value);document.querySelector('#list-title').textContent=`Notes du chantier (${filtered.length})`;if(!filtered.length){list.append(element('p','Aucune note pour le moment. Ajoutez votre première observation.','empty'));return}for(const note of filtered){const card=element('article');card.append(element('span',labels[note.status],`badge ${note.status}`),element('h3',note.chantier),element('p',note.zone,'meta'),element('p',note.description,'description'),element('p','Mis à jour le '+new Date(note.updatedAt).toLocaleString('fr-FR'),'meta'));const actions=element('div',undefined,'actions');const edit=element('button','Modifier');edit.onclick=()=>{editing=note.id;for(const key of ['chantier','zone','description','status'])form.elements[key].value=note[key];document.querySelector('#form-title').textContent='Modifier la note';document.querySelector('#save').textContent='Enregistrer';document.querySelector('#cancel').hidden=false;form.scrollIntoView({behavior:'smooth',block:'start'});form.elements.chantier.focus()};const remove=element('button','Supprimer','danger');remove.onclick=async()=>{if(busy||!confirm('Supprimer cette note ?'))return;busy=true;remove.disabled=true;try{await api('/api/notes/'+note.id,{method:'DELETE'});if(editing===note.id)reset();await load();tell('Note supprimée.')}catch(e){tell(e.message,true)}finally{busy=false;remove.disabled=false}};actions.append(edit,remove);card.append(actions);list.append(card)}}
async function load(){notes=await api('/api/notes');render()}
form.onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;document.querySelector('#save').disabled=true;try{const data=Object.fromEntries(new FormData(form));await api('/api/notes'+(editing?'/'+editing:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});reset();await load();tell('Note enregistrée.')}catch(e){tell(e.message,true)}finally{busy=false;document.querySelector('#save').disabled=false}};
document.querySelector('#cancel').onclick=reset;document.querySelector('#filter').onchange=render;document.querySelector('#refresh').onclick=()=>load().then(()=>tell('Liste actualisée.')).catch(e=>tell(e.message,true));load().catch(()=>{list.textContent='Impossible de charger les notes.';tell('Serveur indisponible. Réessayez avec Actualiser.',true)});
</script></body></html>
